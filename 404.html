<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // Check if path requested a specific error code, otherwise default to 404
        const path = window.location.pathname;
        const match = path.match(/\/(4\d\d|5\d\d)\/?$/);
        const code = match ? match[1] : '404';
        window.location.replace("/error/?code=" + code);
    </script>
    <title>Redirecting...</title>
</head>
<body>
    <p>Redirecting to error page... <a href="/error/?code=404">Click here</a></p>
</body>
</html>
