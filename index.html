<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Aemni | Portfolio & Projects</title>
    
    <!-- Google AdSense Main Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5871246629973328" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --heading-color: #58a6ff;
            --accent-color: #1f6feb;
            --meta-color: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 0 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--heading-color);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            color: var(--meta-color);
            font-size: 1.1rem;
        }

        .ad-box {
            margin: 30px 0;
            padding: 15px;
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            text-align: center;
        }

        .section-title {
            color: var(--heading-color);
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .repo-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .repo-card:hover {
            transform: translateY(-4px);
            border-color: var(--heading-color);
        }

        .repo-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .repo-title a {
            color: var(--heading-color);
            text-decoration: none;
        }

        .repo-title a:hover {
            text-decoration: underline;
        }

        .repo-desc {
            color: var(--meta-color);
            font-size: 0.9rem;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .repo-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--meta-color);
        }

        .repo-lang {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .lang-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-color);
            border-radius: 50%;
            display: inline-block;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--meta-color);
            font-size: 0.9rem;
        }

        #loading {
            text-align: center;
            color: var(--meta-color);
            font-size: 1.1rem;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Profile -->
        <header>
            <h1>Dev Aemni</h1>
            <p>Developer Portfolio & GitHub Projects</p>
        </header>

        <!-- Google AdSense Unit (displayad01) -->
        <div class="ad-box">
            <p style="font-size:12px; color:var(--meta-color); margin-bottom: 8px;">Advertisement</p>
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-5871246629973328"
                 data-ad-slot="7396840873"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>

        <!-- Repositories Section -->
        <h2 class="section-title">Projects & Repositories</h2>
        <div class="repo-grid" id="repo-container">
            <div id="loading">Loading repositories from GitHub...</div>
        </div>

        <footer>
            <p>&copy; 2026 Dev Aemni. Powered by GitHub Pages.</p>
        </footer>
    </div>

    <!-- Script to Fetch Repositories Automatically -->
    <script>
        const username = 'dev-aemni';
        const repoContainer = document.getElementById('repo-container');

        async function fetchRepos() {
            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=100`);
                if (!response.ok) throw new Error('Failed to fetch repositories');
                
                const repos = await response.json();
                repoContainer.innerHTML = ''; // Clear loading indicator

                if (repos.length === 0) {
                    repoContainer.innerHTML = '<p>No public repositories found.</p>';
                    return;
                }

                repos.forEach(repo => {
                    // Skip fork repos if you only want original work (optional)
                    if (repo.fork) return;

                    const card = document.createElement('div');
                    card.className = 'repo-card';

                    const language = repo.language ? repo.language : 'Code';
                    const description = repo.description || 'No description provided.';
                    const stars = repo.stargazers_count;

                    card.innerHTML = `
                        <div>
                            <div class="repo-title">
                                <a href="${repo.html_url}" target="_blank" rel="noopener noreferrer">${repo.name}</a>
                            </div>
                            <div class="repo-desc">${description}</div>
                        </div>
                        <div class="repo-footer">
                            <span class="repo-lang"><span class="lang-dot"></span>${language}</span>
                            <span>⭐ ${stars}</span>
                        </div>
                    `;

                    repoContainer.appendChild(card);
                });
            } catch (error) {
                repoContainer.innerHTML = `<p style="color: #f85149;">Error loading projects: ${error.message}</p>`;
            }
        }

        fetchRepos();
    </script>
</body>
</html>
