<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Aemni | Creative Glass Portfolio</title>
    
    <!-- Google Fonts: Chewy & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Google AdSense Main Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5871246629973328" crossorigin="anonymous"></script>

    <style>
        :root {
            --font-title: 'Chewy', cursive;
            --font-body: 'Inter', sans-serif;
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-sub: #d0d7de;
            --accent-cyan: #00f0ff;
            --accent-pink: #ff007f;
            --accent-purple: #9d4edd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: #060814;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 24px 16px;
        }

        /* Fullscreen Canvas for Big Wave Particle Animation */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        /* Glass Header Card */
        header {
            text-align: center;
            padding: 45px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4),
                        inset 0 0 20px rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 0, 127, 0.15) 0%, rgba(0, 240, 255, 0.1) 40%, transparent 70%);
            pointer-events: none;
            animation: pulseBg 10s ease-in-out infinite alternate;
        }

        @keyframes pulseBg {
            0% { transform: scale(0.9) rotate(0deg); }
            100% { transform: scale(1.1) rotate(15deg); }
        }

        header h1 {
            font-family: var(--font-title);
            font-size: 4rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 0%, #00f0ff 40%, #ff007f 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 12px rgba(0, 240, 255, 0.3));
        }

        header p {
            font-size: 1.2rem;
            color: var(--text-sub);
            letter-spacing: 0.5px;
            font-weight: 300;
        }

        /* Glass Ad Box Container */
        .ad-box {
            margin: 30px 0;
            padding: 18px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px dashed var(--glass-border);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .ad-label {
            font-family: var(--font-title);
            font-size: 1rem;
            color: var(--accent-cyan);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        /* Section Header */
        .section-title {
            font-family: var(--font-title);
            font-size: 2.5rem;
            color: #ffffff;
            margin-bottom: 25px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-cyan), transparent);
        }

        /* Glass Grid & Repo Cards */
        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .repo-card {
            background: var(--glass-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 26px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .repo-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(0, 240, 255, 0.6);
            box-shadow: 0 18px 45px rgba(0, 240, 255, 0.35);
        }

        .repo-title {
            font-family: var(--font-title);
            font-size: 1.75rem;
            margin-bottom: 10px;
            line-height: 1.1;
            letter-spacing: 0.5px;
        }

        .repo-title a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s;
        }

        .repo-card:hover .repo-title a {
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .repo-desc {
            color: var(--text-sub);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 22px;
            flex-grow: 1;
        }

        .repo-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-sub);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 14px;
        }

        .repo-lang {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--accent-cyan);
        }

        .lang-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-pink);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-pink);
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding: 30px 0;
            color: var(--text-sub);
            font-size: 0.95rem;
            border-top: 1px solid var(--glass-border);
            font-family: var(--font-body);
        }

        footer span {
            font-family: var(--font-title);
            color: var(--accent-pink);
            font-size: 1.2rem;
        }

        #loading {
            text-align: center;
            color: var(--accent-cyan);
            font-family: var(--font-title);
            font-size: 1.8rem;
            grid-column: 1 / -1;
            padding: 50px 0;
        }
    </style>
</head>
<body>

    <!-- Particle Wave Canvas Background -->
    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <!-- Header Profile -->
        <header>
            <h1>Dev Aemni</h1>
            <p>Interactive Developer Showcase & Repositories</p>
        </header>

        <!-- Google AdSense Unit (displayad01) -->
        <div class="ad-box">
            <div class="ad-label">ADVERTISEMENT</div>
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-5871246629973328"
                 data-ad-slot="7396840873"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>

        <!-- Repositories Section -->
        <h2 class="section-title">My Projects</h2>
        <div class="repo-grid" id="repo-container">
            <div id="loading">⚡ Loading GitHub Repositories...</div>
        </div>

        <footer>
            <p>&copy; 2026 <span>Dev Aemni</span> • Powered by Glassmorphism & GitHub Pages</p>
        </footer>
    </div>

    <!-- Big Wave Particle Canvas Animation Script -->
    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Particle Wave Configuration
        const numRows = 28;
        const numCols = 65;
        const separation = 40;
        let count = 0;

        // Wave Colors Palette
        const palette = ['#00f0ff', '#ff007f', '#7000ff', '#3a86ff', '#ffffff'];

        function drawWave() {
            ctx.fillStyle = 'rgba(6, 8, 20, 0.25)'; // Smooth motion trail
            ctx.fillRect(0, 0, width, height);

            count += 0.03;

            for (let ix = 0; ix < numCols; ix++) {
                for (let iy = 0; iy < numRows; iy++) {
                    // Calculate 3D projected coordinates for undulating big waves
                    const x = (ix - numCols / 2) * separation + width / 2;
                    
                    // High-amplitude wave trigonometric offset
                    const wave1 = Math.sin((ix + count) * 0.3) * 60;
                    const wave2 = Math.cos((iy + count) * 0.3) * 50;
                    const wave3 = Math.sin((ix + iy + count) * 0.2) * 40;
                    
                    const y = (iy - numRows / 2) * (separation * 0.6) + height / 1.8 + wave1 + wave2 + wave3;
                    
                    // Dynamic particle radius based on depth/wave height
                    const radius = Math.max(0.8, (Math.sin((ix + count) * 0.3) + 1.5) * 2.2);

                    // Color cycle selection
                    const colorIndex = Math.floor(Math.abs(ix + iy + Math.floor(count * 5)) % palette.length);
                    const color = palette[colorIndex];

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2, false);
                    ctx.fillStyle = color;
                    ctx.shadowBlur = radius * 4;
                    ctx.shadowColor = color;
                    ctx.globalAlpha = Math.min(1, Math.max(0.15, (y / height)));
                    ctx.fill();
                    ctx.restore();
                }
            }

            requestAnimationFrame(drawWave);
        }

        drawWave();
    </script>

    <!-- GitHub Repositories Fetch Script -->
    <script>
        const username = 'dev-aemni';
        const repoContainer = document.getElementById('repo-container');

        async function fetchRepos() {
            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=100`);
                if (!response.ok) throw new Error('Failed to load GitHub repositories');
                
                const repos = await response.json();
                repoContainer.innerHTML = '';

                if (repos.length === 0) {
                    repoContainer.innerHTML = '<p style="color:var(--text-sub); grid-column:1/-1; text-align:center;">No public repositories found.</p>';
                    return;
                }

                repos.forEach(repo => {
                    if (repo.fork) return; // Skip forks if desired

                    const card = document.createElement('div');
                    card.className = 'repo-card';

                    const language = repo.language ? repo.language : 'Code';
                    const description = repo.description || 'No description provided for this repository.';
                    const stars = repo.stargazers_count;

                    card.innerHTML = `
                        <div>
                            <div class="repo-title">
                                <a href="${repo.html_url}" target="_blank" rel="noopener noreferrer">${repo.name}</a>
                            </div>
                            <div class="repo-desc">${description}</div>
                        </div>
                        <div class="repo-footer">
                            <span class="repo-lang"><span class="lang-dot"></span>${language}</span>
                            <span>⭐ ${stars}</span>
                        </div>
                    `;

                    repoContainer.appendChild(card);
                });
            } catch (error) {
                repoContainer.innerHTML = `<p style="color: var(--accent-pink); font-family: var(--font-title); font-size: 1.5rem; grid-column: 1/-1; text-align: center;">Error loading projects: ${error.message}</p>`;
            }
        }

        fetchRepos();
    </script>
</body>
</html>
